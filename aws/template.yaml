AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SeeLearn scene generation and grounded explanations through a Lambda Function URL.

Parameters:
  ModelProvider:
    Type: String
    Default: gemini
    AllowedValues: [bedrock, gemini]
    Description: Model provider (gemini or bedrock).
  GeminiModel:
    Type: String
    Default: ''
    Description: Gemini model name (required when ModelProvider is gemini).
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Gemini API key (required when ModelProvider is gemini).
  BedrockModelId:
    Type: String
    Default: ''
    Description: Bedrock model ID for scene generation (required when ModelProvider is bedrock).
  ExplainModelId:
    Type: String
    Default: ''
    Description: Optional Bedrock model ID for explanations; defaults to BedrockModelId.
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: CORS allowed origin for the Function URL.
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: AWS region for the Bedrock runtime client.

Conditions:
  UseBedrock: !Equals [!Ref ModelProvider, bedrock]

Resources:
  SeeLearnFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 150
      MemorySize: 512
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          MODEL_PROVIDER: !Ref ModelProvider
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          EXPLAIN_MODEL_ID: !Ref ExplainModelId
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - !If
          - UseBedrock
          - Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
          - !Ref AWS::NoValue
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type

  SeeLearnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SeeLearnFunction}
      RetentionInDays: 14

Outputs:
  FunctionUrl:
    Description: SeeLearn backend Function URL
    Value: !GetAtt SeeLearnFunctionUrl.FunctionUrl
