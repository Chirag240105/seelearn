AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SeeLearn scene generation and grounded explanations through a Lambda Function URL.

Parameters:
  BedrockModelId:
    Type: String
    Default: ''
    Description: Bedrock model ID used for scene generation.
  ExplainModelId:
    Type: String
    Default: ''
    Description: Optional Bedrock model ID for explanations; defaults to BedrockModelId.
  ModelProvider:
    Type: String
    Default: bedrock
    AllowedValues: [bedrock, gemini]
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ''
  AllowedOrigin:
    Type: String
    Default: '*'
  BedrockRegion:
    Type: String
    Default: us-east-1
  GeminiModel:
    Type: String
    Default: gemini-2.0-flash

Resources:
  SeeLearnFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambdas/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 120
      MemorySize: 512
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          MODEL_PROVIDER: !Ref ModelProvider
          BEDROCK_REGION: !Ref BedrockRegion
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          EXPLAIN_MODEL_ID: !Ref ExplainModelId
          GEMINI_API_KEY: !Ref GeminiApiKey
          GEMINI_MODEL: !Ref GeminiModel
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: '*'
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - !Ref AllowedOrigin
          AllowMethods:
            - POST
          AllowHeaders:
            - content-type

  SeeLearnLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${SeeLearnFunction}
      RetentionInDays: 14

Outputs:
  FunctionUrl:
    Description: SeeLearn backend Function URL
    Value: !GetAtt SeeLearnFunctionUrl.FunctionUrl
